services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-hw
    ports:
      - "8123:8123"  # HTTP-интерфейс
      - "9000:9000"  # Native TCP (для клиента)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

volumes:
  clickhouse_data: