services:
  # === ШАРД 1 ===
  shard1:
    image: postgres:17
    container_name: pg_shard1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shard_db
    ports:
      - "5532:5432"
    volumes:
      - ./init-scripts/shard1.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres 
      -c wal_level=logical 
      -c max_replication_slots=10 
      -c max_wal_senders=10

  # === ШАРД 2 ===
  shard2:
    image: postgres:17
    container_name: pg_shard2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shard_db
    ports:
      - "5533:5432"
    volumes:
      - ./init-scripts/shard2.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres 
      -c wal_level=logical 
      -c max_replication_slots=10 
      -c max_wal_senders=10

  # === РОУТЕР (Агрегатор) ===
  router:
    image: postgres:17
    container_name: pg_router
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: router_db
    ports:
      - "5434:5432"
    volumes:
      - ./init-scripts/router.sql:/docker-entrypoint-initdb.d/init.sql
    depends_on:
      - shard1
      - shard2
    command: >
      postgres 
      -c wal_level=logical